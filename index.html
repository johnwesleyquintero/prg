<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Epic Prompt Generator</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        :root {
            --primary: #8b5cf6;
            --primary-hover: #7c3aed;
            --secondary: #f3f4f6;
            --secondary-hover: #e5e7eb;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --bg-body: #f9fafb;
            --bg-card: #ffffff;
            --border: #e5e7eb;
            --success: #10b981;
            --radius: 12px;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-body);
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            line-height: 1.5;
            padding: 40px 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            display: grid;
            gap: 24px;
        }

        /* Header */
        header {
            text-align: center;
            margin-bottom: 20px;
        }

        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .brand-icon {
            color: var(--primary);
            width: 40px;
            height: 40px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.025em;
            background: linear-gradient(135deg, #8b5cf6 0%, #3b82f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        /* Card Styling */
        .card {
            background: var(--bg-card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .card-header {
            padding: 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fafafa;
        }

        .card-title {
            font-weight: 600;
            font-size: 1.125rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-body {
            padding: 24px;
        }

        /* Form Layout */
        .grid-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group.full-width {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 6px;
            color: var(--text-main);
        }

        .required::after {
            content: " *";
            color: #ef4444;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
            background: #fff;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        textarea.code-input {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            background-color: #f8fafc;
        }

        /* Buttons */
        .btn-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 500;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid transparent;
        }

        button:active {
            transform: translateY(1px);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, #7c3aed 100%);
            color: white;
            box-shadow: 0 4px 6px -1px rgba(124, 58, 237, 0.3);
        }
        .btn-primary:hover {
            box-shadow: 0 6px 8px -1px rgba(124, 58, 237, 0.4);
            filter: brightness(1.1);
        }

        .btn-secondary {
            background-color: white;
            border: 1px solid var(--border);
            color: var(--text-main);
        }
        .btn-secondary:hover {
            background-color: var(--secondary);
            border-color: #d1d5db;
        }

        .btn-danger {
            background-color: white;
            border: 1px solid #fee2e2;
            color: #ef4444;
        }
        .btn-danger:hover {
            background-color: #fef2f2;
            border-color: #fecaca;
        }

        /* Output Section */
        .output-wrapper {
            position: relative;
        }

        .output-area {
            width: 100%;
            min-height: 200px;
            padding: 20px;
            background: #1e1e1e;
            color: #d4d4d4;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            border-radius: 0 0 8px 8px;
            border: none;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .output-toolbar {
            background: #2d2d2d;
            padding: 8px 16px;
            border-radius: 8px 8px 0 0;
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            border-bottom: 1px solid #3e3e3e;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 0.8rem;
            background: rgba(255,255,255,0.1);
            color: white;
            border: none;
        }
        .btn-sm:hover {
            background: rgba(255,255,255,0.2);
        }

        /* Saved Requests Panel */
        .saved-section {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        /* Toast Notification */
        #toast {
            visibility: hidden;
            min-width: 250px;
            background-color: #1f2937;
            color: #fff;
            text-align: center;
            border-radius: 8px;
            padding: 12px 24px;
            position: fixed;
            z-index: 1000;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            opacity: 0;
            transition: opacity 0.3s, bottom 0.3s;
        }

        #toast.show {
            visibility: visible;
            opacity: 1;
            bottom: 50px;
        }

        footer {
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 20px;
        }

        @media (max-width: 768px) {
            .grid-row { grid-template-columns: 1fr; }
            h1 { font-size: 2rem; }
            .saved-section { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="brand">
            <i data-lucide="zap" class="brand-icon"></i>
            <h1>Epic Prompt Generator</h1>
        </div>
        <p class="subtitle">Streamline your workflow with structured, professional prompts.</p>
    </header>

    <!-- Main Form Card -->
    <div class="card">
        <div class="card-header">
            <div class="card-title">
                <i data-lucide="pen-tool" size="20"></i>
                Request Details
            </div>
            
        </div>
        <div class="card-body">
            
            <!-- Category & Saved Requests Row -->
            <div class="grid-row">
                <div class="form-group">
                    <label for="category">Category</label>
                    <div style="position:relative;">
                        <select id="category">
                            <option value="">Select a domain...</option>
                            <option value="Software Development">Software Development</option>
                            <option value="Data Analysis">Data Analysis</option>
                            <option value="Content Creation">Content Creation</option>
                            <option value="System Operations">System Operations</option>
                            <option value="Business Strategy">Business Strategy</option>
                            <option value="UI/UX Design">UI/UX Design</option>
                        </select>
                    </div>
                </div>

                <div class="form-group saved-section">
                    <div style="flex-grow:1;">
                        <label for="savedRequests">Saved Requests</label>
                        <select id="savedRequests">
                            <option value="">Load previous...</option>
                        </select>
                    </div>
                    <button id="deleteSavedBtn" class="btn-danger" style="padding: 12px;" title="Delete Selected">
                        <i data-lucide="trash-2" size="18"></i>
                    </button>
                </div>
            </div>

            <!-- Context -->
            <div class="form-group full-width">
                <label for="context">Context / Background</label>
                <textarea id="context" placeholder="e.g., I am building a React Native app using Expo Router. The target audience is..."></textarea>
            </div>

            <!-- Request -->
            <div class="form-group full-width">
                <label for="request" class="required">Core Request</label>
                <textarea id="request" placeholder="e.g., Create a component that handles user authentication..." style="min-height: 120px; border-color: #d1d5db;"></textarea>
            </div>

            <!-- Parent/Subtask Grid -->
            <div class="grid-row">
                <div class="form-group">
                    <label for="parentTask">Parent Task (Epic)</label>
                    <input type="text" id="parentTask" placeholder="e.g., Auth System Overhaul">
                </div>
                <div class="form-group">
                    <label for="subtask">Current Subtask</label>
                    <input type="text" id="subtask" placeholder="e.g., Login Screen Styling">
                </div>
            </div>

            <!-- Relevant Data -->
            <div class="form-group full-width">
                <label for="relevantData">Relevant Data / Code Snippets</label>
                <textarea id="relevantData" class="code-input" placeholder="Paste JSON, logs, or code snippets here..."></textarea>
            </div>

            <!-- Action Buttons -->
            <div class="btn-group">
                <button id="generateBtn" class="btn-primary">
                    <i data-lucide="sparkles"></i> Generate Prompt
                </button>
                <button id="saveBtn" class="btn-secondary">
                    <i data-lucide="save"></i> Save Input
                </button>
                <button id="clearBtn" class="btn-secondary">
                    <i data-lucide="rotate-ccw"></i> Reset
                </button>
            </div>
        </div>
    </div>

    <!-- Output Section -->
    <div class="card" id="outputSection">
        <div class="output-wrapper">
            <div class="output-toolbar">
                <button id="copyBtn" class="btn-sm">
                    <i data-lucide="copy" size="16"></i> Copy
                </button>
                <button id="downloadBtn" class="btn-sm">
                    <i data-lucide="download" size="16"></i> Save .txt
                </button>
            </div>
            <div class="output-area" id="outputArea">Your structured prompt will render here...</div>
        </div>
    </div>

    <footer>
        <p>&copy; 2025 Epic Generator. Built for efficiency.</p>
    </footer>
</div>

<!-- Toast Element -->
<div id="toast"><i data-lucide="check-circle"></i> <span id="toastMsg">Success</span></div>

<script>
    // Initialize Lucide Icons
    lucide.createIcons();

    document.addEventListener('DOMContentLoaded', function(){
        // Elements
        const els = {
            category: document.getElementById('category'),
            context: document.getElementById('context'),
            request: document.getElementById('request'),
            parentTask: document.getElementById('parentTask'),
            subtask: document.getElementById('subtask'),
            relevantData: document.getElementById('relevantData'),
            savedRequests: document.getElementById('savedRequests'),
            outputArea: document.getElementById('outputArea'),
            // Buttons
            generateBtn: document.getElementById('generateBtn'),
            saveBtn: document.getElementById('saveBtn'),
            clearBtn: document.getElementById('clearBtn'),
            copyBtn: document.getElementById('copyBtn'),
            downloadBtn: document.getElementById('downloadBtn'),
            deleteSavedBtn: document.getElementById('deleteSavedBtn')
        };

        // Toast Function
        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            const msg = document.getElementById('toastMsg');
            msg.textContent = message;
            
            // Icon handling
            const icon = toast.querySelector('svg');
            if(icon) icon.remove();
            
            const newIcon = document.createElement('i');
            newIcon.setAttribute('data-lucide', isError ? 'alert-circle' : 'check-circle');
            newIcon.style.color = isError ? '#f87171' : '#34d399';
            toast.prepend(newIcon);
            lucide.createIcons();

            toast.className = "show";
            setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
        }

        // Logic: Load Saved
        function loadSavedRequests() {
            let saved = JSON.parse(localStorage.getItem('epg_saved') || '[]');
            els.savedRequests.innerHTML = '<option value="">Load previous...</option>';
            saved.forEach((r, i) => {
                let option = document.createElement('option');
                option.value = i;
                option.textContent = r.name || `Request ${i + 1}`;
                els.savedRequests.appendChild(option);
            });
        }

        // Logic: Autosave Session
        function autosaveForm() {
            const formState = {
                category: els.category.value,
                context: els.context.value,
                request: els.request.value,
                parentTask: els.parentTask.value,
                subtask: els.subtask.value,
                relevantData: els.relevantData.value
            };
            sessionStorage.setItem('epg_session', JSON.stringify(formState));
        }

        // Logic: Load Autosave
        function loadAutosave() {
            const state = JSON.parse(sessionStorage.getItem('epg_session') || '{}');
            if (state) {
                if(state.category) els.category.value = state.category;
                if(state.context) els.context.value = state.context;
                if(state.request) els.request.value = state.request;
                if(state.parentTask) els.parentTask.value = state.parentTask;
                if(state.subtask) els.subtask.value = state.subtask;
                if(state.relevantData) els.relevantData.value = state.relevantData;
            }
        }

        // Event: Save Request
        els.saveBtn.addEventListener('click', function() {
            if(!els.request.value && !els.context.value) {
                showToast("Enter some data to save!", true);
                return;
            }
            const name = prompt("Name this request preset:", `Req ${new Date().toLocaleDateString()}`);
            if (name === null) return;
            
            const data = {
                name: name.trim() || `Untitled ${Date.now()}`,
                category: els.category.value,
                context: els.context.value,
                request: els.request.value,
                parentTask: els.parentTask.value,
                subtask: els.subtask.value,
                relevantData: els.relevantData.value
            };
            
            let saved = JSON.parse(localStorage.getItem('epg_saved') || '[]');
            saved.push(data);
            localStorage.setItem('epg_saved', JSON.stringify(saved));
            loadSavedRequests();
            showToast(`Saved "${data.name}"!`);
        });

        // Event: Load Selected
        els.savedRequests.addEventListener('change', function() {
            if (this.value === '') return;
            const saved = JSON.parse(localStorage.getItem('epg_saved') || '[]');
            const sel = saved[this.value];
            if (sel) {
                els.category.value = sel.category || '';
                els.context.value = sel.context || '';
                els.request.value = sel.request || '';
                els.parentTask.value = sel.parentTask || '';
                els.subtask.value = sel.subtask || '';
                els.relevantData.value = sel.relevantData || '';
                showToast("Request loaded");
                autosaveForm();
            }
        });

        // Event: Delete Selected
        els.deleteSavedBtn.addEventListener('click', function(){
            const val = els.savedRequests.value;
            if(val === '') {
                showToast("Select a request to delete", true);
                return;
            }
            if(confirm("Permanently delete this saved request?")) {
                let saved = JSON.parse(localStorage.getItem('epg_saved') || '[]');
                saved.splice(val, 1);
                localStorage.setItem('epg_saved', JSON.stringify(saved));
                loadSavedRequests();
                showToast("Request deleted");
            }
        });

        // Event: Generate
        els.generateBtn.addEventListener('click', function() {
            if (!els.request.value.trim()) {
                showToast("Core Request field is required!", true);
                els.request.focus();
                return;
            }

            const timestamp = new Date().toLocaleString();
            let prompt = `### 🤖 Prompt Request\n**Date:** ${timestamp}\n\n`;

            if (els.category.value) prompt += `**Category:** ${els.category.value}\n`;
            if (els.parentTask.value) prompt += `**Epic/Parent Task:** ${els.parentTask.value}\n`;
            if (els.subtask.value) prompt += `**Current Subtask:** ${els.subtask.value}\n`;
            
            prompt += `\n---\n\n`;

            if (els.context.value.trim()) {
                prompt += `### 📝 Context\n${els.context.value.trim()}\n\n`;
            }

            prompt += `### 🚀 Core Request\n${els.request.value.trim()}\n\n`;

            if (els.relevantData.value.trim()) {
                prompt += `### 📊 Relevant Data / Code\n\`\`\`\n${els.relevantData.value.trim()}\n\`\`\`\n\n`;
            }

            prompt += `---\n\n`;
            prompt += `### 🎯 Instructions\n`;
            prompt += `1. Analyze the context and data provided above.\n`;
            prompt += `2. Provide a step-by-step, high-quality solution.\n`;
            prompt += `3. If code is required, ensure it is optimized, commented, and error-free.\n`;
            prompt += `4. Format the output cleanly using Markdown.`;

            els.outputArea.textContent = prompt;
            
            // Scroll to output
            document.getElementById('outputSection').scrollIntoView({ behavior: 'smooth' });
            showToast("Prompt Generated!");
            autosaveForm();
        });

        // Event: Clear
        els.clearBtn.addEventListener('click', function() {
            if (confirm("Reset all fields? This cannot be undone.")) {
                els.category.value = '';
                els.context.value = '';
                els.request.value = '';
                els.parentTask.value = '';
                els.subtask.value = '';
                els.relevantData.value = '';
                els.outputArea.textContent = 'Your structured prompt will render here...';
                sessionStorage.removeItem('epg_session');
                showToast("Form reset");
            }
        });

        // Event: Copy
        els.copyBtn.addEventListener('click', function() {
            const text = els.outputArea.textContent;
            if (text.includes('will render here...')) {
                showToast("Generate a prompt first", true);
                return;
            }
            navigator.clipboard.writeText(text).then(() => {
                showToast("Copied to clipboard");
            }).catch(() => showToast("Failed to copy", true));
        });

        // Event: Download
        els.downloadBtn.addEventListener('click', function() {
            const text = els.outputArea.textContent;
            if (text.includes('will render here...')) {
                showToast("Generate a prompt first", true);
                return;
            }
            const blob = new Blob([text], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'epic-prompt.md';
            a.click();
            URL.revokeObjectURL(url);
            showToast("Download started");
        });

        // Listeners for Autosave
        document.querySelectorAll('input,textarea,select').forEach(el => el.addEventListener('input', autosaveForm));

        // Init
        loadSavedRequests();
        loadAutosave();
    });
</script>
</body>
</html>
